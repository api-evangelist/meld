paths:
  /crypto/order/headless/offramp:
    post:
      tags:
      - Headless
      summary: Create a headless offramp order
      description: Creates a headless offramp order. Caller passes customer + provider + source crypto + fiat payout method and receives a provider-issued wallet address to send cryptocurrency to.
      operationId: /crypto-order-headless-offramp-create
      parameters:
      - name: Meld-Version
        in: header
        description: Dated API version to use for this request, e.g. `2026-02-03`.
        required: false
        schema:
          type: string
          example: '2026-02-03'
      - name: X-Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties:
                default: ''
              default: ''
              allOf:
              - $ref: '#/components/schemas/HeadlessOrderOfframpRequest'
            examples:
              achOfframp:
                description: achOfframp
                value:
                  customerId: WQ4Cp7mWmkQpjQjxxxxxx
                  destinationCurrencyCode: USD
                  fiatPayoutMethod:
                    type: ACH
                    owner: Jane Doe
                    details:
                      bankName: Example Bank
                      accountType: CHECKING
                      routingNumber: '110000000'
                      accountNumber: 000123456789
                      beneficiaryAddress:
                        streetLineOne: 123 Main St
                        city: New York
                        state: NY
                        postalCode: '10001'
                        country: US
                      bankAddress:
                        streetLineOne: 1 Bank Plaza
                        city: New York
                        state: NY
                        postalCode: '10005'
                        country: US
                  serviceProvider: NOAH
                  sourceAmount: 100
                  sourceCurrencyCode: USDC
                  sourceWalletAddress: '0x000000000000000000000000000000000000dEaD'
            example:
              customerId: WQ4Cp7mWmkQpjQjxxxxxx
              destinationCurrencyCode: USD
              fiatPayoutMethod:
                type: ACH
                owner: Jane Doe
                details:
                  bankName: Example Bank
                  accountType: CHECKING
                  routingNumber: '110000000'
                  accountNumber: 000123456789
                  beneficiaryAddress:
                    streetLineOne: 123 Main St
                    city: New York
                    state: NY
                    postalCode: '10001'
                    country: US
                  bankAddress:
                    streetLineOne: 1 Bank Plaza
                    city: New York
                    state: NY
                    postalCode: '10005'
                    country: US
              serviceProvider: NOAH
              sourceAmount: 100
              sourceCurrencyCode: USDC
              sourceWalletAddress: '0x000000000000000000000000000000000000dEaD'
        required: true
      responses:
        '201':
          description: Headless offramp order created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/HeadlessOrderOfframpResponse'
        '500':
          description: 'Internal Error


            Meld could not serialise the response. Your request is not at fault — contact Meld support with the requestId.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`JSON_PROCESSING_ERROR`'
                  message:
                    type: string
                    description: Error processing JSON
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              example:
                code: JSON_PROCESSING_ERROR
                message: Error processing JSON
                requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                timestamp: '2026-08-14T09:41:22.482+00:00'
        '403':
          description: 'Unauthenticated or authenticated with insufficient access


            Check the account''s permissions for this operation.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`FORBIDDEN`'
                  message:
                    type: string
                    description: Access denied
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              example:
                code: FORBIDDEN
                message: Access denied
                requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                timestamp: '2026-08-14T09:41:22.482+00:00'
        '401':
          description: 'Invalid credentials


            Check the API credentials being sent.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`UNAUTHORIZED`'
                  message:
                    type: string
                    description: Access denied
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              example:
                code: UNAUTHORIZED
                message: Access denied
                requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                timestamp: '2026-08-14T09:41:22.482+00:00'
        '400':
          description: 'Bad Request : check request values and format


            - `INVALID_CRYPTO_CURRENCY` — The cryptocurrency code is not one Meld supports. Check it against the supported-crypto list.

            - `INVALID_PAYMENT_METHOD` — The payment method could not be resolved for this offramp order.

            - `PASSTHROUGH_CREDENTIALS_INVALID` — Read errors[] — it names each passthrough credential field that is missing or conflicting. Which fields are required varies by provider.

            - `TRANSACTION_INVALID_PROVIDER` — Correct the named value and send the request again.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 'Any of:


                      - `INVALID_CRYPTO_CURRENCY`

                      - `INVALID_PAYMENT_METHOD`

                      - `PASSTHROUGH_CREDENTIALS_INVALID`

                      - `TRANSACTION_INVALID_PROVIDER`'
                  errors:
                    type: array
                    description: 'Any of:


                      - `[Meld-Version] is invalid`

                      - `[X-Idempotency-Key] is invalid`

                      - `Cannot use both passthrough key private and oauth at the same time`

                      - `Missing either passthrough key private or oauth`

                      - `Missing passthrough key id`

                      - `Missing passthrough key private`

                      - `Missing passthrough key public`

                      - `Missing passthrough oauth`

                      - `Missing passthrough reference`

                      - `Missing service provider`'
                    items:
                      type: string
                  message:
                    type: string
                    description: 'Any of:


                      - Invalid Crypto Currency requested

                      - Invalid Payment Method requested

                      - Invalid service provider

                      - Passthrough credentials invalid'
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              examples:
                INVALID_CRYPTO_CURRENCY:
                  value:
                    code: INVALID_CRYPTO_CURRENCY
                    message: Invalid Crypto Currency requested
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                INVALID_PAYMENT_METHOD:
                  value:
                    code: INVALID_PAYMENT_METHOD
                    message: Invalid Payment Method requested
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                PASSTHROUGH_CREDENTIALS_INVALID:
                  value:
                    code: PASSTHROUGH_CREDENTIALS_INVALID
                    message: Passthrough credentials invalid
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                TRANSACTION_INVALID_PROVIDER:
                  value:
                    code: TRANSACTION_INVALID_PROVIDER
                    message: Invalid service provider
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
        '404':
          description: 'Not found


            Verify the identifier in the request.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`NOT_FOUND`'
                  message:
                    type: string
                    description: Resource not found
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              example:
                code: NOT_FOUND
                message: Resource not found
                requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                timestamp: '2026-08-14T09:41:22.482+00:00'
        '409':
          description: 'Conflict


            Resolve the conflicting state, then retry.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`CONFLICT`'
                  message:
                    type: string
                    description: Conflict
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              example:
                code: CONFLICT
                message: Conflict
                requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                timestamp: '2026-08-14T09:41:22.482+00:00'
      security:
      - ApiKeyAuth: []
      x-mint:
        href: /api-reference/crypto/headless/crypto-order-headless-offramp-create
  /payments/virtual-account/deposit-instructions:
    post:
      tags:
      - Headless
      summary: Create or retrieve standing virtual-account onramp deposit instructions
      description: Provisions a standing virtual bank account for recurring onramp deposits, or returns the existing instructions when the same customer, provider, payment method, currency pair, and destination wallet were already set up.
      operationId: /payments-virtual-account-deposit-instructions-create
      parameters:
      - name: Meld-Version
        in: header
        description: Dated API version to use for this request, e.g. `2026-02-03`.
        required: false
        schema:
          type: string
          example: '2026-02-03'
      - name: X-Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VirtualAccountDepositInstructionsRequest'
            example:
              customerId: <string>
              destinationCurrencyCode: USDC
              destinationWalletAddress: '0x000000000000000000000000000000000000dEaD'
              paymentMethodType: ACH
              serviceProvider: NOAH
              sourceCurrencyCode: USD
        required: true
      responses:
        '201':
          description: Deposit instructions created or returned successfully
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/VirtualAccountDepositInstructionsResponse'
        '500':
          description: 'Internal Error


            - `JSON_PROCESSING_ERROR` — A value could not be serialised on Meld''s side. Contact Meld support with the requestId; a retry may not clear it.

            - `SERVICE_PROVIDER_ERROR` — The provider did not return deposit instructions. Retry, then contact Meld support with the requestId.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 'Any of:


                      - `JSON_PROCESSING_ERROR`

                      - `SERVICE_PROVIDER_ERROR`'
                  message:
                    type: string
                    description: 'Any of:


                      - Error processing JSON

                      - Service Provider Error'
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              examples:
                JSON_PROCESSING_ERROR:
                  value:
                    code: JSON_PROCESSING_ERROR
                    message: Error processing JSON
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                SERVICE_PROVIDER_ERROR:
                  value:
                    code: SERVICE_PROVIDER_ERROR
                    message: Service Provider Error
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
        '403':
          description: 'Unauthenticated or authenticated with insufficient access


            - `KYC_NOT_COMPLETED` — The customer''s KYC is not approved. Complete it before requesting deposit instructions.

            - `SERVICE_PROVIDER_NOT_ENABLED` — The provider is not enabled for this account. Enable it on the Meld dashboard.

            - `WHITELABEL_NOT_ENABLED` — White-label virtual accounts are not enabled for this account. Contact Meld to enable them.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 'Any of:


                      - `KYC_NOT_COMPLETED`

                      - `SERVICE_PROVIDER_NOT_ENABLED`

                      - `WHITELABEL_NOT_ENABLED`'
                  message:
                    type: string
                    description: 'Any of:


                      - Customer has not completed KYC for the requested provider

                      - Headless integration is not enabled for this account/provider pair

                      - Service provider is not enabled for this account'
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              examples:
                KYC_NOT_COMPLETED:
                  value:
                    code: KYC_NOT_COMPLETED
                    message: Customer has not completed KYC for the requested provider
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                SERVICE_PROVIDER_NOT_ENABLED:
                  value:
                    code: SERVICE_PROVIDER_NOT_ENABLED
                    message: Service provider is not enabled for this account
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                WHITELABEL_NOT_ENABLED:
                  value:
                    code: WHITELABEL_NOT_ENABLED
                    message: Headless integration is not enabled for this account/provider pair
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
        '401':
          description: 'Invalid credentials


            Check the API credentials being sent.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`UNAUTHORIZED`'
                  message:
                    type: string
                    description: Access denied
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              example:
                code: UNAUTHORIZED
                message: Access denied
                requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                timestamp: '2026-08-14T09:41:22.482+00:00'
        '400':
          description: 'Bad Request : check request values and format


            - `CUSTOMER_ID_REQUIRED` — Send either customerId or externalCustomerId. Both were blank.

            - `CUSTOMER_NOT_FOUND` — No customer matched the identifier supplied. Verify it before retrying.

            - `EXTERNAL_ORDER_ID_NOT_UNIQUE` — This externalOrderId is already used on the account. Send a different one, or fetch the existing order rather than recreating it.

            - `HEADLESS_NOT_SUPPORTED` — Not supported for this provider or combination. Choose another.

            - `INVALID_CRYPTO_CURRENCY` — The cryptocurrency code is not one Meld supports. Check it against the supported-crypto list.

            - `INVALID_PAYMENT_METHOD` — Correct the named value and send the request again.

            - `NOT_SUPPORTED` — This combination is not offered for the chosen provider or transaction type. Choose a different one.

            - `PASSTHROUGH_CREDENTIALS_INVALID` — Read errors[] — it names each passthrough credential field that is missing or conflicting. Which fields are required varies by provider.

            - `PAYMENT_METHOD_NOT_SUPPORTED` — Not supported for this provider or combination. Choose another.

            - `PHONE_NUMBER_REQUIRED` — Send customerPhoneNumber. It is required when paymentMethodType is MOBILE_MONEY.

            - `TRANSACTION_INVALID_PROVIDER` — No service provider was supplied on the request.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 'Any of:


                      - `CUSTOMER_ID_REQUIRED`

                      - `CUSTOMER_NOT_FOUND`

                      - `EXTERNAL_ORDER_ID_NOT_UNIQUE`

                      - `HEADLESS_NOT_SUPPORTED`

                      - `INVALID_CRYPTO_CURRENCY`

                      - `INVALID_PAYMENT_METHOD`

                      - `NOT_SUPPORTED`

                      - `PASSTHROUGH_CREDENTIALS_INVALID`

                      - `PAYMENT_METHOD_NOT_SUPPORTED`

                      - `PHONE_NUMBER_REQUIRED`

                      - `TRANSACTION_INVALID_PROVIDER`'
                  errors:
                    type: array
                    description: 'Any of:


                      - `[customerId] must not be blank`

                      - `[destinationCurrencyCode] must not be blank`

                      - `[destinationWalletAddress] must not be blank`

                      - `[paymentMethodType] must not be null`

                      - `[serviceProvider] must not be null`

                      - `[sourceCurrencyCode] must not be blank`

                      - `[Meld-Version] is invalid`

                      - `[X-Idempotency-Key] is invalid`

                      - `Cannot use both passthrough key private and oauth at the same time`

                      - `Missing either passthrough key private or oauth`

                      - `Missing passthrough key id`

                      - `Missing passthrough key private`

                      - `Missing passthrough key public`

                      - `Missing passthrough oauth`

                      - `Missing passthrough reference`

                      - `Missing service provider`'
                    items:
                      type: string
                  message:
                    type: string
                    description: 'Any of:


                      - Customer not found

                      - Either customerId or externalCustomerId is required

                      - Invalid Crypto Currency requested

                      - Invalid Payment Method requested

                      - Invalid service provider

                      - Operation not supported for service provider

                      - Passthrough credentials invalid

                      - Provider does not support headless onramp orders

                      - Requested payment method is not supported for this provider in headless mode

                      - customerPhoneNumber is required for the requested payment method

                      - externalOrderId must be unique per account'
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              examples:
                CUSTOMER_ID_REQUIRED:
                  value:
                    code: CUSTOMER_ID_REQUIRED
                    message: Either customerId or externalCustomerId is required
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                CUSTOMER_NOT_FOUND:
                  value:
                    code: CUSTOMER_NOT_FOUND
                    message: Customer not found
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
