openapi: 3.2.0
info:
  title: CRYPTO Retail Ramp API
  termsOfService: urn:tos
  license:
    name: Apache 2.0
    url: https://springdoc.org
  version: '2026-02-03'
  description: ''
servers:
- url: https://api-sb.meld.io
  description: Meld API sandbox
- url: https://api.meld.io
  description: Meld API production
tags:
- name: Retail Ramp
  description: ''
paths:
  /payments/crypto/quote:
    post:
      tags:
      - Retail Ramp
      summary: Create a crypto quote
      description: Use this endpoint to request the current exchange rate of the selected fiat currency-cryptocurrency pair, and the required fees. Enter a fiat currency as the sourceCurrencyCode to buy crypto and enter a crypto currency in that field to sell crypto.
      operationId: /crypto-quote-get
      parameters:
      - name: Meld-Version
        in: header
        description: Dated API version to use for this request, e.g. `2026-02-03`.
        required: false
        schema:
          type: string
          example: '2026-02-03'
      - name: includeSwap
        in: query
        description: If true, include both direct ramp/offramp quotes and stitched ramp+swap/offramp+swap quotes (CRYPTO_PURCHASE_SWAP / CRYPTO_SELL_SWAP) in the response. When false, swap is only used as a fallback when no direct ramp or offramp providers return quotes. Swap quotes are gated by the per-account onrampSwapEnabled / offrampSwapEnabled preferences regardless of this flag.
        required: false
        schema:
          type: string
          default: ''
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CryptoQuoteRequest'
            example:
              countryCode: US
              destinationCurrencyCode: BTC
              sourceAmount: 100
              sourceCurrencyCode: USD
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/CryptoQuoteResponse20260203'
        '403':
          description: 'Unauthenticated or authenticated with insufficient access


            Check the account''s permissions for this operation.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`FORBIDDEN`'
                  message:
                    type: string
                    description: Access denied
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              example:
                code: FORBIDDEN
                message: Access denied
                requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                timestamp: '2026-08-14T09:41:22.482+00:00'
        '401':
          description: 'Invalid credentials


            Meld could not authenticate with the provider. Your credentials are not at fault — contact Meld support with the requestId.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`SERVICE_PROVIDER_AUTHENTICATION_EXCEPTION`'
                  message:
                    type: string
                    description: Authentication error on service provider
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              example:
                code: SERVICE_PROVIDER_AUTHENTICATION_EXCEPTION
                message: Authentication error on service provider
                requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                timestamp: '2026-08-14T09:41:22.482+00:00'
        '400':
          description: 'Bad Request : check request values and format


            - `ACCOUNT_OFFRAMP_NOT_ENABLED` — Offramp is not enabled for this account. Enable it on the Meld dashboard.

            - `ACCOUNT_ONRAMP_NOT_ENABLED` — Onramp is not enabled for this account. Enable it on the Meld dashboard.

            - `BAD_REQUEST` — Send either customerId or externalCustomerId — this operation needs one of them and neither was supplied.

            - `INCOMPATIBLE_REQUEST` — A provider rejected the combination of values as unusable together. Change the currency pair, payment method or country.

            - `INVALID_AMOUNT` — A provider rejected the amount for this route. Adjust it and request a new quote.

            - `INVALID_AMOUNT_OR_CURRENCY` — Correct the named value and send the request again.

            - `INVALID_AMOUNT_TOO_HIGH` — The amount is above the maximum for every provider that covers this route. Lower it.

            - `INVALID_AMOUNT_TOO_LOW` — The amount is below the minimum for every provider that covers this route. Raise it.

            - `INVALID_CRYPTO_CURRENCY` — Correct the named value and send the request again.

            - `INVALID_QUERY_PARAMETER` — Read errors[] — it names each query parameter that failed validation.

            - `NOT_SUPPORTED` — This quote type is not offered for the chosen provider.

            - `PASSTHROUGH_CREDENTIALS_INVALID` — Read errors[] — it names each passthrough credential field that is missing or conflicting. Which fields are required varies by provider.

            - `TRANSACTION_INVALID_PARAMETER` — The transaction category could not be resolved from the request.

            - `TRANSACTION_INVALID_PROVIDER` — Correct the named value and send the request again.

            - `TRANSACTION_PROPERTY_COMBINATION_NOT_SUPPORTED_BY_SERVICE_PROVIDER` — Not supported for this provider or combination. Choose another.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 'Any of:


                      - `ACCOUNT_OFFRAMP_NOT_ENABLED`

                      - `ACCOUNT_ONRAMP_NOT_ENABLED`

                      - `BAD_REQUEST`

                      - `INCOMPATIBLE_REQUEST`

                      - `INVALID_AMOUNT`

                      - `INVALID_AMOUNT_OR_CURRENCY`

                      - `INVALID_AMOUNT_TOO_HIGH`

                      - `INVALID_AMOUNT_TOO_LOW`

                      - `INVALID_CRYPTO_CURRENCY`

                      - `INVALID_QUERY_PARAMETER`

                      - `NOT_SUPPORTED`

                      - `PASSTHROUGH_CREDENTIALS_INVALID`

                      - `TRANSACTION_INVALID_PARAMETER`

                      - `TRANSACTION_INVALID_PROVIDER`

                      - `TRANSACTION_PROPERTY_COMBINATION_NOT_SUPPORTED_BY_SERVICE_PROVIDER`'
                  errors:
                    type: array
                    description: 'Any of:


                      - `[countryCode] must not be null`

                      - `[destinationCurrencyCode] must not be blank`

                      - `[sourceAmount] DecimalMin (value = "0.0", inclusive = false); must not be null`

                      - `[sourceCurrencyCode] must not be blank`

                      - `[Meld-Version] is invalid`

                      - `[includeSwap] is invalid`

                      - `Cannot use both passthrough key private and oauth at the same time`

                      - `Missing either passthrough key private or oauth`

                      - `Missing passthrough key id`

                      - `Missing passthrough key private`

                      - `Missing passthrough key public`

                      - `Missing passthrough oauth`

                      - `Missing passthrough reference`

                      - `Missing service provider`'
                    items:
                      type: string
                  message:
                    type: string
                    description: 'Any of:


                      - Bad request

                      - Buying crypto is not enabled for your account, please enable it on the Meld dashboard to receive quotes.

                      - Incompatible request: Body does not match service providers

                      - Invalid Crypto Currency requested

                      - Invalid amount or currency

                      - Invalid currency amount

                      - Invalid parameter to create transaction

                      - Invalid query parameter

                      - Invalid service provider

                      - Operation not supported for service provider

                      - Passthrough credentials invalid

                      - Property combination not supported

                      - Selling crypto is not enabled for your account, please enable it on the Meld dashboard to receive quotes.

                      - Source amount is above the maximum allowed

                      - Source amount is below the minimum allowed'
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              examples:
                ACCOUNT_OFFRAMP_NOT_ENABLED:
                  value:
                    code: ACCOUNT_OFFRAMP_NOT_ENABLED
                    message: Selling crypto is not enabled for your account, please enable it on the Meld dashboard to receive quotes.
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                ACCOUNT_ONRAMP_NOT_ENABLED:
                  value:
                    code: ACCOUNT_ONRAMP_NOT_ENABLED
                    message: Buying crypto is not enabled for your account, please enable it on the Meld dashboard to receive quotes.
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                BAD_REQUEST:
                  value:
                    code: BAD_REQUEST
                    message: Bad request
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                INCOMPATIBLE_REQUEST:
                  value:
                    code: INCOMPATIBLE_REQUEST
                    message: 'Incompatible request: Body does not match service providers'
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                INVALID_AMOUNT:
                  value:
                    code: INVALID_AMOUNT
                    message: Invalid currency amount
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                INVALID_AMOUNT_OR_CURRENCY:
                  value:
                    code: INVALID_AMOUNT_OR_CURRENCY
                    message: Invalid amount or currency
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                INVALID_AMOUNT_TOO_HIGH:
                  value:
                    code: INVALID_AMOUNT_TOO_HIGH
                    message: Source amount is above the maximum allowed
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                INVALID_AMOUNT_TOO_LOW:
                  value:
                    code: INVALID_AMOUNT_TOO_LOW
                    message: Source amount is below the minimum allowed
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                INVALID_CRYPTO_CURRENCY:
                  value:
                    code: INVALID_CRYPTO_CURRENCY
                    message: Invalid Crypto Currency requested
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                INVALID_QUERY_PARAMETER:
                  value:
                    code: INVALID_QUERY_PARAMETER
                    message: Invalid query parameter
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                NOT_SUPPORTED:
                  value:
                    code: NOT_SUPPORTED
                    message: Operation not supported for service provider
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                PASSTHROUGH_CREDENTIALS_INVALID:
                  value:
                    code: PASSTHROUGH_CREDENTIALS_INVALID
                    message: Passthrough credentials invalid
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                TRANSACTION_INVALID_PARAMETER:
                  value:
                    code: TRANSACTION_INVALID_PARAMETER
                    message: Invalid parameter to create transaction
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                TRANSACTION_INVALID_PROVIDER:
                  value:
                    code: TRANSACTION_INVALID_PROVIDER
                    message: Invalid service provider
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                TRANSACTION_PROPERTY_COMBINATION_NOT_SUPPORTED_BY_SERVICE_PROVIDER:
                  value:
                    code: TRANSACTION_PROPERTY_COMBINATION_NOT_SUPPORTED_BY_SERVICE_PROVIDER
                    message: Property combination not supported
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
        '500':
          description: 'Server Error. This applies to all 5xx errors, including but not limited to 500, 501, 502, 503, and 504 errors. You should treat all of these errors the same.


            - `SERVICE_PROVIDER_ERROR` — The provider failed while quoting. Retry, then contact Meld support with the requestId.

            - `TRANSACTION_FAILED_GETTING_CRYPTO_QUOTE` — The provider returned no quote where one was expected. Contact Meld support with the requestId.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 'Any of:


                      - `SERVICE_PROVIDER_ERROR`

                      - `TRANSACTION_FAILED_GETTING_CRYPTO_QUOTE`'
                  message:
                    type: string
                    description: 'Any of:


                      - Failed getting crypto quote

                      - Service Provider Error'
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              examples:
                SERVICE_PROVIDER_ERROR:
                  value:
                    code: SERVICE_PROVIDER_ERROR
                    message: Service Provider Error
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
                TRANSACTION_FAILED_GETTING_CRYPTO_QUOTE:
                  value:
                    code: TRANSACTION_FAILED_GETTING_CRYPTO_QUOTE
                    message: Failed getting crypto quote
                    requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                    timestamp: '2026-08-14T09:41:22.482+00:00'
        '404':
          description: 'Resource Not Found


            No provider could produce a quote for this combination. Adjust the amount, currency pair or country, or request a different provider.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`NOT_FOUND`'
                  message:
                    type: string
                    description: Resource Not Found
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              example:
                code: NOT_FOUND
                message: Resource Not Found
                requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                timestamp: '2026-08-14T09:41:22.482+00:00'
        '408':
          description: 'Service provider took too long to respond


            Providers did not respond in time. Retry with backoff.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`QUOTE_TIMEOUT`'
                  message:
                    type: string
                    description: Service provider took too long to respond
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              example:
                code: QUOTE_TIMEOUT
                message: Service provider took too long to respond
                requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                timestamp: '2026-08-14T09:41:22.482+00:00'
        '422':
          description: 'Failed getting crypto quote from provider


            No provider returned a quote and none reported a reason. Adjust the amount, currency pair or country, or request a different provider.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`TRANSACTION_FAILED_GETTING_CRYPTO_QUOTE_FROM_PROVIDER`'
                  message:
                    type: string
                    description: Failed getting crypto quote from provider
                  requestId:
