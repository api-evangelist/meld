      summary: Search transactions
      description: Search a list of transactions you've previously created. The transactions are ordered by the date of creation.
      operationId: /payments-transactions-search
      parameters:
      - name: Meld-Version
        in: header
        description: Dated API version to use for this request, e.g. `2026-02-03`.
        required: false
