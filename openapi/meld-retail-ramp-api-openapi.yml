      - name: statuses
        in: query
        description: 'Comma separated list of transaction status.


          If present, only transactions with the specified status will be included.


          *Possible values*:


          PENDING_CREATED


          PENDING


          PROCESSING


          AUTHORIZED


          AUTHORIZATION_EXPIRED


          SETTLING


          ONRAMP_SETTLED


          SETTLED


          REFUNDED


          DECLINED


          CANCELLED


          FAILED


          ERROR


          VOIDED


          TWO_FA_REQUIRED


          TWO_FA_PROVIDED'
        required: false
        schema:
          type: string
          default: ''
      - name: serviceProviders
        in: query
        description: 'Comma separated list of service providers.


          Return only transactions with these specific providers. You can specify multiple service providers in the query string and separate them with commas


          Reference [Crypto supported service providers](https://docs.meld.io/docs/crypto-supported-service-providers-assets) and [Fiat supported service providers](https://docs.meld.io/docs/fiat-supported-service-providers) for a full list of supported service providers'
        required: false
        schema:
          type: string
          default: ''
      - name: limit
        in: query
        description: 'Limits number of returned accounts.


          *Default value*: 10 or the number of ids provided


          *Minimum value*: 1


          *Maximum value*: 100'
        required: false
        schema:
          type: string
          default: ''
      - name: amountFrom
        in: query
        description: Return only transactions with the amount equal to or greater than this amount
        required: false
        schema:
          type: string
          default: ''
      - name: amountTo
        in: query
        description: Return only transactions with the amount equal to or less than this amount
        required: false
        schema:
          type: string
          default: ''
      - name: from
        in: query
        description: 'Return only transactions created after this DateTime. The correct string will use the ISO DateTime or ISO Date Format.


