      - ApiKeyAuth: []
      x-mint:
        href: /api-reference/crypto/retail-ramp/crypto-quote-get
  /crypto/session/widget:
    post:
      tags:
      - Retail Ramp
      summary: Create a crypto widget
      description: Use this endpoint to create a crypto widget for a session to buy or sell crypto.
      operationId: /crypto-session-widget-create
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionTokenForWidgetRequestV20231219'
            example:
              sessionType: BUY
              sessionData:
                serviceProvider: TOPPER
                countryCode: US
                sourceCurrencyCode: USD
                sourceAmount: '100'
                destinationCurrencyCode: BTC
                walletAddress: bc1qr74wmrcwqq9w5yxczxj6udts9mnqsh3xlhk5yp
              externalSessionId: example-session-id
              externalCustomerId: example-customer-id
        required: true
      responses:
        '200':
          description: Widget created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SessionTokenResponse'
        '403':
          description: 'Unauthenticated or authenticated with insufficient access


            The customer has not met this provider''s verification requirements. Read errors[] for the unsatisfied fields, then call the requirements endpoint named in the message for what the provider needs.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`VERIFICATION_REQUIRED`'
                  message:
                    type: string
                    description: Customer verification is required for this service provider
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
                    type: string
                    format: date-time
                    example: '2026-08-14T09:41:22.482+00:00'
                    description: When the failure occurred. ISO 8601, UTC (`YYYY-MM-DDThh:mm:ss.sss+00:00`).
              example:
                code: VERIFICATION_REQUIRED
                message: Customer verification is required for this service provider
                requestId: 01JB2K7C9XQZ4M8N2P5R6T3V
                timestamp: '2026-08-14T09:41:22.482+00:00'
        '401':
          description: 'Invalid credentials


            Meld could not authenticate with the provider. Your credentials are not at fault — contact Meld support with the requestId.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`SERVICE_PROVIDER_AUTHENTICATION_EXCEPTION`'
                  message:
                    type: string
                    description: Authentication error on service provider
                  requestId:
                    type: string
                    description: Quote this when asking Meld about a specific failure.
                  serviceProviderDetails:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The provider's own error code, when it sent one.
                      message:
                        type: string
                        description: The provider's own message.
                    additionalProperties: {}
                    example:
                      code: '5034'
                      message: Digital currency and blockchain combination is restricted for customer's country
                    description: The provider's own error detail, when the failure came from a service provider. Usually `code` and `message`; a few providers pass their own body through, so other keys can appear.
                  timestamp:
